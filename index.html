<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorial - CAPISTRANO</title>
    <link rel="icon" type="image/png" href="./img/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400..700;1,400..700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a class="pular" href="#eventos">Ir para os momentos</a>

    <header class="topo">
        <a class="topo-insta" href="https://www.instagram.com/iee.nucleoscapistrano_itaimpta/" target="_blank" rel="noopener noreferrer" aria-label="Instagram do Núcleo Capistrano (abre em nova aba)">
            <img src="img/insta.png" alt="">
        </a>
    </header>

    <main>

        <section class="hero">
            <img class="hero-logo" src="img/icon.png" alt="">
            <h1 class="hero-titulo">
                <span class="hero-memorial">Memorial</span>
                <span class="hero-nucleo">NÚCLEO CAPISTRANO</span>
            </h1>
            <p class="hero-dica">Toque em um momento para ver as fotografias.</p>
        </section>

        <section id="eventos" class="eventos" aria-label="Momentos do memorial">
            <div class="grade" id="grade"></div>
            <noscript><p class="aviso-js">Ative o JavaScript do navegador para ver os momentos do memorial.</p></noscript>
        </section>

    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>Projeto desenvolvido por <strong>Maria Eduarda Alcântara</strong></p>
            <p>© 2026 - Instituto Esporte e Educação</p>
        </div>
    </footer>

    <!-- dados e componente -->
    <script src="eventos.js"></script>
    <script src="script.js"></script>
</body>

</html>
